[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textuniq"
version = "0.1.0"
description = "Повышение уникальности русских текстов в Word через цепочку офлайн-перевода"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "protobuf>=4",
]
dev = [
    "pytest>=8",
]

[project.scripts]
textuniq = "textuniq.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "models: тесты, которые загружают настоящие модели перевода (медленно, нужен интернет при первом запуске)",
]
addopts = "-m 'not models'"
